<script>
(()=>{

  const fy=yAt(1,cx);x.fillStyle='#1a0a10';dot(x,cx,fy-h*.052,h*.0085);
  x.beginPath();x.moveTo(cx-h*.012,fy);x.lineTo(cx-h*.006,fy-h*.044);x.lineTo(cx+h*.006,fy-h*.044);x.lineTo(cx+h*.012,fy);x.closePath();x.fill();
  x.fillStyle=lin(x,0,hz-h*.05,0,hz+h*.1,[[0,'rgba(255,200,150,0)'],[.5,'rgba(255,200,150,.18)'],[1,'rgba(255,200,150,0)']]);x.fillRect(0,hz-h*.05,w,h*.15);

 river(x,w,h,cx,r){

  for(let i=0;i<90;i++){x.fillStyle=`rgba(255,255,255,${r()*.8})`;x.fillRect(r()*w,r()*hz*.9,1.4,1.4)}

  x.fillStyle=lin(x,0,hz,0,h,[[0,'#10435a'],[1,'#030b13']]);x.fillRect(0,hz,w,h-hz);
  for(let i=0;i<48;i++){const t=i/48,y=hz+t*(h-hz),ww=(1-t*.6)*h*.2*(.35+r()*.65);x.fillStyle=`rgba(225,243,255,${.55*(1-t)})`;x.fillRect(cx-ww/2+(r()-.5)*14,y,ww,1.5+t*3)}
  x.fillStyle='#02070b';x.beginPath();x.moveTo(0,hz+3);
  for(let px=0;px<=w;px+=12){const edge=Math.pow(Math.abs(px-cx)/(w*.5),1.6),ht=h*.025+edge*h*.2*(.4+r()*.9);x.lineTo(px,hz+3-ht);x.lineTo(px+6,hz+3-ht*.45)}

  const bx=cx-h*.2,by=hz+h*.13;x.fillStyle='#010406';

  for(let i=0;i<32;i++){const a0=i/32*Math.PI*2,a1=a0+Math.PI/32*.85;x.fillStyle=`rgba(255,${170+(i%3)*30},90,${i%2?.1:.04})`;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a0)*R,cy+Math.sin(a0)*R);x.lineTo(cx+Math.cos(a1)*R,cy+Math.sin(a1)*R);x.closePath();x.fill()}
  glow(x,cx,cy,h*.55,'255,214,120',.95);glow(x,cx,cy,h*.2,'255,255,230',1);

   for(let wy=h-bh+8;wy<h-8;wy+=13)for(let wx=px+5;wx<px+bw-6;wx+=10)if(r()<.22){x.fillStyle=r()<.5?'#ffb44d':'#ff6a3a';x.fillRect(wx,wy,4,6)}
   px+=bw+2}
  x.fillStyle='#08060a';x.fillRect(cx-h*.04,h*.36,h*.08,h*.64);x.beginPath();x.moveTo(cx-h*.04,h*.36);x.lineTo(cx,h*.28);x.lineTo(cx+h*.04,h*.36);x.fill();
  for(let i=0;i<150;i++){const a=r()*Math.PI*2,d=r()*h*.5;x.fillStyle=`rgba(255,${120+r()*100|0},50,${.2+r()*.7})`;dot(x,cx+Math.cos(a)*d*1.3,cy+Math.sin(a)*d-d*.2,.8+r()*2.4)}

 orbit(x,w,h,cx,r){
  x.fillStyle=lin(x,0,0,w,h,[[0,'#050316'],[1,'#1a0b3a']]);x.fillRect(0,0,w,h);

  const cy=h*.5,R=h*.2;
  const ring=back=>{x.save();x.translate(cx,cy);x.rotate(-.32);x.scale(1,.26);[1.55,1.7,1.92].forEach((k,i)=>{x.strokeStyle=`rgba(255,${215-i*25},${190-i*30},${.75-i*.2})`;x.lineWidth=R*(.12+i*.04);x.beginPath();x.arc(0,0,R*k,back?Math.PI:0,back?Math.PI*2:Math.PI);x.stroke()});x.restore()};
  ring(true);
  const g=x.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);[[0,'#ffd9a8'],[.35,'#e0709a'],[.7,'#6a2a8a'],[1,'#150a30']].forEach(([o,c])=>g.addColorStop(o,c));
  x.fillStyle=g;dot(x,cx,cy,R);ring(false);
  const sx=cx+R*2.3,sy=cy-R*1.1;x.fillStyle='#cfc7e8';x.fillRect(sx-5,sy-5,10,10);x.fillRect(sx-34,sy-2,24,4);x.fillRect(sx+10,sy-2,24,4);glow(x,sx,sy,28,'180,200,255',.4);
 },
 forest(x,w,h,cx,r){
  x.fillStyle=lin(x,0,0,0,h,[[0,'#041a26'],[.55,'#0e4a55'],[1,'#13785f']]);x.fillRect(0,0,w,h);
  for(let i=0;i<50;i++){x.fillStyle=`rgba(255,255,255,${r()*.7})`;x.fillRect(r()*w,r()*h*.4,1.4,1.4)}
  const my=h*.26;glow(x,cx,my,h*.4,'255,240,170',.35);x.fillStyle='#fff3b0';dot(x,cx,my,h*.085);
  ['#0c4650','#0a3a44','#072c36','#041f28'].forEach((c,i)=>{const base=h*(.52+i*.1);x.fillStyle=c;x.fillRect(0,base,w,h-base);for(let px=-10;px<w+20;px+=18+r()*10){const ht=h*(.06+r()*.08)*(1+i*.15);x.beginPath();x.moveTo(px-12,base+2);x.lineTo(px,base-ht);x.lineTo(px+12,base+2);x.closePath();x.fill()}});
  const by=h*.78,R=h*.065;
  const bg=x.createRadialGradient(cx-R*.3,by-R*.3,R*.1,cx,by,R);bg.addColorStop(0,'#d4ffe6');bg.addColorStop(1,'#4fc69a');
  x.fillStyle='#4fc69a';[-1,1].forEach(s=>{x.beginPath();x.moveTo(cx+s*R*.7,by-R*.55);x.lineTo(cx+s*R*.95,by-R*1.75);x.lineTo(cx+s*R*.2,by-R*.95);x.closePath();x.fill()});
  x.fillStyle=bg;dot(x,cx,by,R);
  [-1,1].forEach(s=>{x.fillStyle='#fff';dot(x,cx+s*R*.36,by-R*.12,R*.22);x.fillStyle='#10303a';dot(x,cx+s*R*.36,by-R*.1,R*.11)});
  x.strokeStyle='#2a1e12';x.lineWidth=3;x.beginPath();x.moveTo(cx+R*1.05,by+R*.4);x.lineTo(cx+R*1.35,by-R*.9);x.stroke();
  glow(x,cx+R*1.4,by-R*1.05,R*2.4,'255,230,120',.75);x.fillStyle='#fff2b0';dot(x,cx+R*1.4,by-R*1.05,R*.17);
  for(let i=0;i<140;i++){const px=r()*w,py=h*(.3+r()*.65);glow(x,px,py,5+r()*14,'220,255,120',.5);x.fillStyle='#f4ffb0';dot(x,px,py,1.3)}
 },
 house(x,w,h,cx,r){
  x.fillStyle=lin(x,0,0,0,h,[[0,'#0a0f10'],[.6,'#27393a'],[1,'#0b1214']]);x.fillRect(0,0,w,h);
  const mx=cx+h*.14,my=h*.3,mr=h*.14;glow(x,mx,my,mr*4,'200,230,215',.35);x.fillStyle='#e8f1ea';dot(x,mx,my,mr);
  x.fillStyle='rgba(120,140,130,.25)';dot(x,mx-mr*.3,my-mr*.1,mr*.25);dot(x,mx+mr*.35,my+mr*.35,mr*.17);dot(x,mx+mr*.2,my-mr*.5,mr*.12);
  const gy=h*.8;x.fillStyle='#050809';x.beginPath();x.moveTo(0,gy+h*.03);x.quadraticCurveTo(cx,gy-h*.05,w,gy+h*.02);x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fill();
  const hs=h*.34,hx=cx-hs/2,hy=gy-h*.015;
  x.fillStyle='#030506';x.fillRect(hx,hy-h*.22,hs,h*.22);
  x.beginPath();x.moveTo(hx-h*.02,hy-h*.22);x.lineTo(cx,hy-h*.38);x.lineTo(hx+hs+h*.02,hy-h*.22);x.closePath();x.fill();
  const tx=hx-h*.05;x.fillRect(tx,hy-h*.34,h*.09,h*.34);x.beginPath();x.moveTo(tx-h*.01,hy-h*.34);x.lineTo(tx+h*.045,hy-h*.46);x.lineTo(tx+h*.1,hy-h*.34);x.closePath();x.fill();
  x.fillRect(hx+hs*.7,hy-h*.36,h*.03,h*.1);
  x.fillStyle='#0f1b1d';for(let i=0;i<3;i++)for(let j=0;j<2;j++)if(!(i===1&&j===0))x.fillRect(hx+hs*.12+i*hs*.3,hy-h*.18+j*h*.085,h*.035,h*.05);
  glow(x,hx+hs*.42+h*.0175,hy-h*.155,h*.15,'255,200,90',.6);x.fillStyle='#ffd98a';x.fillRect(hx+hs*.42,hy-h*.18,h*.035,h*.05);
  x.strokeStyle='#030506';x.lineCap='round';
  const br=(bx,by2,l,a,d)=>{if(d<=0)return;const x2=bx+Math.cos(a)*l,y2=by2+Math.sin(a)*l;x.lineWidth=d*1.6;x.beginPath();x.moveTo(bx,by2);x.lineTo(x2,y2);x.stroke();br(x2,y2,l*.74,a-.4-r()*.3,d-1);br(x2,y2,l*.74,a+.4+r()*.3,d-1)};
  br(w*.1,gy+h*.03,h*.1,-Math.PI/2,7);br(w*.92,gy+h*.03,h*.09,-Math.PI/2,7);
  for(let i=0;i<5;i++){x.save();x.translate(r()*w,gy+i*h*.04);x.scale(1,.2);glow(x,0,0,w*.4,'190,210,205',.16);x.restore()}
 }
};
function artCanvas(m,kind){
  const bd=kind==='bd',w=bd?1280:640,h=bd?720:960,cx=bd?w*.7:w*.5;
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  try{SCENES[m.scene](x,w,h,cx,mulberry(hashStr(m.id+kind)))}catch(e){x.fillStyle='#2a0d14';x.fillRect(0,0,w,h)}
  const g=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=g;x.fillRect(0,0,w,h);
  return c;
}
const scaled=(src,w,h,q)=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(src,0,0,w,h);return c.toDataURL('image/jpeg',q)};
MOVIES.forEach(m=>{
  m.bd=artCanvas(m,'bd');const po=artCanvas(m,'po');
  m.bdURL=m.bd.toDataURL('image/jpeg',.82);m.poURL=po.toDataURL('image/jpeg',.86);
  m.smURL=scaled(po,200,300,.8);m.tnURL=scaled(m.bd,360,203,.72);
});

/* ---------- salas e sessões ---------- */
const ROOMS={
 1:{name:'Sala 1',rows:10,cols:14,rec:2,recAdd:8,base:28,screenW:12,z0:3.2,dz:1.05,desc:'A maior sala, com fileiras em degraus. As duas últimas fileiras têm poltronas reclináveis.'},
 2:{name:'Sala 2',rows:8,cols:12,rec:0,recAdd:0,base:24,screenW:9.5,z0:2.8,dz:1,desc:'Sala média, boa para animações e lançamentos em sessões da tarde.'},
 3:{name:'Sala 3 VIP',rows:6,cols:10,rec:6,recAdd:0,base:42,screenW:7.5,z0:2.6,dz:1.15,desc:'Todas as poltronas são reclináveis. Sala menor, com sessões em horário nobre.'}
};
const SCHED=[
 [1,'14:00',0,'3D LEG'],[1,'16:45',3,'3D LEG'],[1,'19:30',0,'3D LEG'],[1,'22:00',2,'2D LEG'],
 [2,'14:30',4,'2D DUB'],[2,'16:30',4,'2D DUB'],[2,'18:45',1,'2D LEG'],[2,'21:15',5,'2D LEG'],[2,'23:30',5,'2D LEG'],
 [3,'15:30',2,'VIP LEG'],[3,'18:15',3,'VIP LEG'],[3,'21:00',1,'VIP LEG']
];
const NOW=new Date();
const DAYS=[...Array(7)].map((_,i)=>new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+i));
const WD=['dom','seg','ter','qua','qui','sex','sáb'],MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const longDate=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const ALL=[];
DAYS.forEach((d,di)=>{
  const list=SCHED.slice();if(d.getDay()===0||d.getDay()===6)list.push([2,'11:00',4,'2D DUB']);
  list.forEach(([room,time,mi,fmt])=>{const [hh,mm]=time.split(':').map(Number);ALL.push({id:`${di}-${room}-${time}`,day:di,room,time,mi,fmt,start:new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm)})});
});
const ofDay=d=>ALL.filter(s=>s.day===d);
const byId=id=>ALL.find(s=>s.id===id);
const isPast=s=>s.start.getTime()<Date.now()-10*60000;
const price=(s,ri)=>{const R=ROOMS[s.room];return R.base+(ri>=R.rows-R.rec?R.recAdd:0)};
function build(s){
  if(s._b)return s._b;
  const R=ROOMS[s.room],rnd=mulberry(hashStr(s.id)),wk=[0,6].includes(DAYS[s.day].getDay());
  const p=.16+rnd()*.42+(wk?.08:0)+(+s.time.slice(0,2)>=18?.1:0);
  const rows=[];
  for(let i=0;i<R.rows;i++){
    const row={label:String.fromCharCode(65+i),seats:[]};
    for(let c=0;c<R.cols;c++){
      let type=i>=R.rows-R.rec?'rec':'std';if(i===R.rows-1&&(c<2||c>=R.cols-2))type='acc';
      const dx=Math.abs(c-(R.cols-1)/2)/((R.cols-1)/2),w=(1.3-dx*.55)*(i<2?.6:1);
      row.seats.push({type,taken:type!=='acc'&&rnd()<p*w});
    }
    rows.push(row);
  }
  return s._b={rows};
}
const occ=s=>{const b=build(s);let t=0,n=0;b.rows.forEach(r=>r.seats.forEach(x=>{n++;if(x.taken)t++}));return t/n};

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}

const fan={el:$('#fan'),pos:2,tgt:2,cards:[],raf:0,drag:null,shown:-1};
const FSTEP=13;
MOVIES.forEach(m=>{
  const c=document.createElement('div');c.className='fc';

  $('#fanGo').addEventListener('click',()=>goSessions(i));
}
function fanRender(){
  fan.cards.forEach((c,i)=>{
    const d=i-fan.pos,ad=Math.abs(d);
    c.style.transform=`rotate(${d*FSTEP}deg) scale(${1-Math.min(ad,2.5)*.06})`;
    c.style.zIndex=String(50-Math.round(ad*4));
    c.style.filter=`brightness(${Math.max(.32,1-ad*.24)})`;

  });
  fanInfo(clamp(Math.round(fan.pos),0,NM-1));
}
function fanLoop(){
  cancelAnimationFrame(fan.raf);
  const step=()=>{
    if(fan.drag){fan.raf=requestAnimationFrame(step);return}
    const d=fan.tgt-fan.pos;
    if(Math.abs(d)<.003||reduce){fan.pos=fan.tgt;fanRender();return}
    fan.pos+=d*.14;fanRender();fan.raf=requestAnimationFrame(step);
  };
  fan.raf=requestAnimationFrame(step);
}
fan.el.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  fan.drag={x:e.clientX,p:fan.pos,moved:0,lx:e.clientX,lt:performance.now(),v:0,card:e.target.closest('.fc')};
  try{fan.el.setPointerCapture(e.pointerId)}catch(_){}
});
fan.el.addEventListener('pointermove',e=>{
  const d=fan.drag;if(!d)return;const dx=e.clientX-d.x,now=performance.now();
  d.moved=Math.max(d.moved,Math.abs(dx));if(d.moved>6)fan.el.classList.add('drag');
  d.v=(e.clientX-d.lx)/Math.max(1,now-d.lt);d.lx=e.clientX;d.lt=now;
  fan.pos=clamp(d.p-dx/(cardW()*.55),-.3,NM-.7);fanRender();
});
const fanUp=()=>{
  const d=fan.drag;if(!d)return;fan.drag=null;fan.el.classList.remove('drag');
  if(d.moved<6){
    const i=d.card?fan.cards.indexOf(d.card):-1;
    if(i>=0&&i===Math.round(fan.pos))goSessions(i);else if(i>=0)fan.tgt=i;
  }else fan.tgt=clamp(Math.round(fan.pos-d.v*220/(cardW()*.55)),0,NM-1);
  fanLoop();
};
fan.el.addEventListener('pointerup',fanUp);fan.el.addEventListener('pointercancel',fanUp);

  if(e.key==='ArrowRight'){fan.tgt=clamp(Math.round(fan.pos)+1,0,NM-1);fanLoop();e.preventDefault()}
  if(e.key==='ArrowLeft'){fan.tgt=clamp(Math.round(fan.pos)-1,0,NM-1);fanLoop();e.preventDefault()}

});

/* ---------- visão do telão (canvas) ---------- */
const pov={cv:$('#pov'),x:$('#pov').getContext('2d'),cam:null,raf:0};

function drawPOV(cam){
  const S=cur(),R=ROOMS[S.room],B=build(S),m=MOVIES[S.mi],x=pov.x,W=pov.cv.width,H=pov.cv.height,f=W*.43;
  const half=R.screenW/2,yb=1.5,yt=yb+R.screenW/2.1,ym=(yb+yt)/2;

  const dpc=c3(0,ym,cam.z)[2],botOff=f*(ym-yb)/dpc;

  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);
  x.fillStyle=lin(x,0,0,0,H,[[0,'#050203'],[1,'#12080b']]);x.fillRect(0,0,W,H);
  [-1,1].forEach(sg=>{
    const xa=sg*(half+.1),xb=sg*(half+1.7),p=[pr(xa,0,cam.z),pr(xb,0,cam.z),pr(xb,yt+1.4,cam.z),pr(xa,yt+1.4,cam.z)];

    x.drawImage(src,u0*sw,sy0,sw/N+1,sh,0,0,1,1);
  }
  x.setTransform(1,0,0,1,0,0);
  for(let j=0;j<R.rows;j++){
    const D=cam.z-geo(S.room,j,0).z;if(D<.4)continue;
    const fy=j*.2,topY=fy+1.0,botY=fy+.3,t=Math.min(1,D/14),cr=150-92*t|0,cg=26-16*t|0,cb=42-24*t|0;
    for(let c=0;c<R.cols;c++){
      const X=geo(S.room,j,c).x,L=pr(X-.27,topY,D),Rt=pr(X+.27,topY,D),Bm=pr(X,botY,D);
      if(Rt[0]<-20||L[0]>W+20)continue;
      const sy=(L[1]+Rt[1])/2,w2=Rt[0]-L[0],h2=Math.min(H*3,Bm[1]-sy);
      if(B.rows[j].seats[c].taken){const hc=pr(X,fy+1.06,D);x.fillStyle='#0a0405';x.beginPath();x.arc(hc[0],hc[1],f*.115/D,0,7);x.fill()}
      x.fillStyle=lin(x,0,sy,0,sy+h2,[[0,`rgb(${cr+40},${cg+8},${cb+10})`],[1,`rgb(${cr},${cg},${cb})`]]);
      rr(x,L[0],sy,w2,h2,w2*.3);x.fill();

  }
  const sc=pr(0,ym,cam.z),rad=Math.max(Math.abs(cn[1][0]-cn[0][0]),W*.5)*.75;
  x.save();x.globalCompositeOperation='screen';const g2=x.createRadialGradient(sc[0],sc[1],0,sc[0],sc[1],rad);g2.addColorStop(0,hexA(m.glow,.24));g2.addColorStop(1,hexA(m.glow,0));x.fillStyle=g2;x.fillRect(0,0,W,H);x.restore();

  x.save();x.fillStyle=ag;x.shadowColor='rgba(88,227,165,.7)';x.shadowBlur=26;rr(x,-30,H*.91,W*.17,H*.2,26);x.fill();rr(x,W*.83,H*.91,W*.17+30,H*.2,26);x.fill();x.restore();
  const vg=x.createRadialGradient(W/2,H*.5,H*.35,W/2,H*.5,W*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=vg;x.fillRect(0,0,W,H);
}
function povTo(g,instant){
  const to={x:g.x,z:g.z,h:g.h};cancelAnimationFrame(pov.raf);

  $('#povFrom').textContent=`Vista da ${row.label}${v.c+1}`;

  pts.sort((a,b)=>a[1]-b[1]);
  return pts.map(([px,py,s,k])=>`<g fill="${cols[k*4|0]}" stroke="#e0b25a" stroke-width=".8" stroke-opacity=".55"><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${s.toFixed(1)}"/><circle cx="${(px+s*.55).toFixed(1)}" cy="${(py-s*.25).toFixed(1)}" r="${(s*.62).toFixed(1)}"/><circle cx="${(px-s*.5).toFixed(1)}" cy="${(py-s*.2).toFixed(1)}" r="${(s*.58).toFixed(1)}"/></g>`).join('');

}
function cupG(o){

const cartCount=()=>Object.values(state.cart).reduce((a,b)=>a+b,0);

const ctl=p=>{const q=state.cart[p.id]||0;return q?`<div class="qty"><button type="button" data-dec="${p.id}" aria-label="Diminuir ${p.name}">−</button><b>${q}</b><button type="button" data-inc="${p.id}" aria-label="Aumentar ${p.name}">+</button></div>`:`<button class="btn btn-ghost add" type="button" data-inc="${p.id}">Adicionar ao pedido</button>`};
function renderProds(){
  $('#prods').innerHTML=PRODS.map((p,i)=>`<article class="prod rv" style="--rd:${(i%3)*.08}s" data-p="${p.id}">${p.badge?`<span class="badge">${p.badge}</span>`:''}<div class="stage"><div class="fl" style="--d:${-i*.7}s">${p.art()}</div><span class="shelf"></span></div><div class="p-top"><h3>${p.name}</h3><span class="price">${brl(p.price)}</span></div><p>${p.desc}</p><div class="ctl">${ctl(p)}</div></article>`).join('');

$('#prods').addEventListener('click',e=>{
  const b=e.target.closest('[data-inc],[data-dec]');if(!b)return;
  const id=b.dataset.inc||b.dataset.dec,d=b.dataset.inc?1:-1;

$('#prods').addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||reduce)return;const c=e.target.closest('.prod');if(!c)return;
  const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;

$('#prods').addEventListener('pointerout',e=>{const c=e.target.closest('.prod');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});
function updatePanel(){
  const S=cur();if(!S)return;const n=state.sel.length,k=cartCount();
  $('#picked').innerHTML=n?state.sel.map((s,i)=>`<span class="pk">${build(S).rows[s.r].label}${s.c+1}<button type="button" data-rm="${i}" aria-label="Remover assento">×</button></span>`).join(''):'Nenhum assento escolhido ainda.';

  const b=$('#btnBook');b.disabled=!n;b.textContent=n?`Reservar ${n} ${n>1?'assentos':'assento'}`:'Escolha um assento';
}
$('#picked').addEventListener('click',e=>{
  const b=e.target.closest('[data-rm]');if(!b)return;const s=state.sel.splice(+b.dataset.rm,1)[0];
  const el=seatBtn(s.r,s.c);el&&(el.classList.remove('sel'),el.setAttribute('aria-pressed','false'));
  showSeat(lastSel()||state.base);updatePanel();updateOrder();

function updateOrder(){
  const n=state.sel.length,k=cartCount(),el=$('#order');
  if(!n&&!k){el.hidden=true;return}
  el.hidden=false;
  $('#orderS').textContent=[n?`${n} ${n>1?'assentos':'assento'}`:'',k?`${k} ${k>1?'itens':'item'}`:''].filter(Boolean).join(' + ');

$('#orderBtn').addEventListener('click',()=>{if(state.sel.length)finalize();else{toast('Escolha ao menos um assento para finalizar');scrollTo($('#assentos'))}});

/* ---------- ingresso ---------- */
function barcode(seed){
  const r=mulberry(hashStr(seed));let px=0,s='';
  while(px<300){const w=1+Math.floor(r()*3),g=1+Math.floor(r()*2);s+=`<rect x="${px}" y="0" width="${w}" height="56" fill="#fff"/>`;px+=w+g}
  return `<svg viewBox="0 0 ${px} 56" preserveAspectRatio="none" aria-hidden="true">${s}</svg>`;
}
function finalize(){
  const S=cur(),B=build(S),n=state.sel.length;if(!n){toast('Escolha ao menos um assento');return}
  const seats=[...state.sel].sort((a,b)=>a.r-b.r||a.c-b.c),labels=seats.map(s=>B.rows[s.r].label+(s.c+1));
  const code='CMX'+hashStr(S.id+labels.join()+Date.now()).toString(36).toUpperCase().slice(0,6);
  const tot=total(),items=cartCount(),m=MOVIES[S.mi];
  const rowsU=[...new Set(seats.map(s=>B.rows[s.r].label))];
  const cols=rowsU.length===1?[['Sala',String(S.room).padStart(2,'0')],['Fileira',rowsU[0]],['Assentos',seats.map(s=>s.c+1).join(', ')]]:[['Sala',String(S.room).padStart(2,'0')],['Formato',S.fmt.split(' ')[0]],['Assentos',labels.join(' ')]];
  seats.forEach(s=>{B.rows[s.r].seats[s.c].taken=true});
  state.sel=[];state.cart={};state.base=defaultView(S);state.view=state.base;
  renderMap();renderProds();renderSessions();showSeat(state.base,true);updatePanel();updateOrder();
  const d=DAYS[S.day];
  $('#ticket').innerHTML=`<div class="tk-note">Ingresso para ${n} ${n>1?'pessoas':'pessoa'}</div><div class="tk-poster"><img src="${m.poURL}" alt=""><b>${m.title}</b></div><div class="tk-row"><span>${d.getDate()} ${MO[d.getMonth()]}</span><span>${S.time}</span><span>${brl(tot)}</span></div><div class="tk-cols">${cols.map(([a,b])=>`<div><small>${a.toUpperCase()}</small><b>${b}</b></div>`).join('')}</div>${items?`<div class="tk-extra">Bomboniere: ${items} ${items>1?'itens':'item'} para retirar na sessão</div>`:''}<div class="tk-stub">${barcode(code)}<small>${code}</small></div>`;
  openModal();
}
let modalFocus=null,confT;
function openModal(){
  modalFocus=document.activeElement;$('#modal').hidden=false;document.documentElement.style.overflow='hidden';
  setTimeout(()=>$('#mClose').focus({preventScroll:true}),50);
  clearTimeout(confT);confT=setTimeout(confetti,reduce?0:2300);
}
function closeModal(){$('#modal').hidden=true;document.documentElement.style.overflow='';clearTimeout(confT);const c=$('#confetti');c.getContext('2d').clearRect(0,0,c.width,c.height);modalFocus&&modalFocus.focus&&modalFocus.focus({preventScroll:true})}
$('#mClose').addEventListener('click',closeModal);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
function confetti(){
  if(reduce)return;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff5361','#f2b659','#58e3a5','#5aa9ff','#fff3df','#d92d3b'];
  const P=[...Array(150)].map(()=>({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight*.16,vx:(Math.random()-.5)*11,vy:-Math.random()*9-3,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(t-t0<3600)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0);
}

$('#bulbT').innerHTML=$('#bulbB').innerHTML='<i></i>'.repeat(24);
let rvObs;
function observeRv(){
  if(!('IntersectionObserver'in window)){$$('.rv').forEach(e=>e.classList.add('in'));return}
  rvObs=rvObs||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rvObs.unobserve(e.target)}}),{threshold:.15});
  $$('.rv:not(.in)').forEach(e=>rvObs.observe(e));
}
(()=>{
  const facts=$('#facts');let done=false;
  new IntersectionObserver((es,o)=>{if(!es[0].isIntersecting||done)return;done=true;o.disconnect();if(reduce)return;
    $$('b[data-n]',facts).forEach(b=>{const n=+b.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1400);b.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})
  },{threshold:.4}).observe(facts);
})();
